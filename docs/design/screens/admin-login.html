<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#8C6239',
                            background: '#FDFBF8',
                            text: '#2C2320',
                            error: '#B45454'
                        }
                    },
                    fontFamily: {
                        headline: ['Playfair Display', 'serif'],
                        body: ['Public Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Public Sans', sans-serif; background-color: #FDFBF8; }
        .font-headline { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-brand-background text-brand-text min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white p-10 rounded-lg shadow-[0_4px_20px_rgba(140,98,57,0.08)] border border-[#E7DED2] text-center">
        <!-- Wordmark -->
        <h1 class="font-headline text-2xl font-bold mb-2 tracking-tight">Mayan's Cake Factory</h1>
        
        <!-- Heading -->
        <h2 class="font-headline text-3xl mb-8">Bakery sign in</h2>

        <!-- Sign-in Form -->
        <form class="text-left space-y-6">
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium mb-2 text-brand-text/80">Email</label>
                <input type="email" id="email" name="email" 
                    class="w-full px-4 py-3 border border-[#E7DED2] rounded-md focus:outline-none focus:ring-1 focus:ring-brand-primary/50 focus:border-brand-primary transition-all bg-[#FDFBF8]"
                    placeholder="Enter your staff email">
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium mb-2 text-brand-text/80">Password</label>
                <input type="password" id="password" name="password" 
                    class="w-full px-4 py-3 border border-[#E7DED2] rounded-md focus:outline-none focus:ring-1 focus:ring-brand-primary/50 focus:border-brand-primary transition-all bg-[#FDFBF8]"
                    placeholder="Enter your password">
            </div>

            <!-- Primary Button -->
            <button type="submit" 
                class="w-full bg-brand-primary text-white font-medium py-3.5 rounded-md hover:bg-[#7A5430] active:scale-[0.98] transition-all duration-200 shadow-sm">
                Sign in
            </button>

            <!-- Error Message -->
            <p class="text-brand-error text-sm text-center font-medium mt-4">
                Email or password is incorrect.
            </p>
        </form>

        <!-- Footer Line -->
        <div class="mt-10 pt-6 border-t border-[#E7DED2]">
            <p class="text-brand-text/60 text-xs tracking-wide">
                This area is for bakery staff.
            </p>
        </div>
    </div>

</body>
</html>
